<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPV Commandes</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--txt:#1d2433;--mut:#6b7385;--line:#e3e6ec;--acc:#2f5bea;
--ok:#1f9d55;--ko:#d9534f;--warn:#e0a100;--okbg:#e6f6ec;--kobg:#fcebea;--warnbg:#fff6dc;--we:#eceef3;--cp:#cfe9ff;--abs:#ffd9a8;--fer:#e4d8f5}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e2330;--txt:#e8ebf2;--mut:#98a1b6;--line:#2d3446;
--okbg:#173525;--kobg:#3a1d1d;--warnbg:#3a3114;--we:#252b3a;--cp:#17354f;--abs:#4d3516;--fer:#35294d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
main{padding:14px 16px 40px;max-width:1500px;margin:auto}
button,select,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt)}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.kpi b{font-size:20px;display:block}.kpi span{color:var(--mut);font-size:12px}
.note{background:var(--warnbg);border:1px dashed var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.sub{color:var(--mut);font-size:12px}
/* priorités */
.cmd{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:10px;margin-bottom:8px}
.cmd.complet{border-left-color:#1f9d55}.cmd.fabrication{border-left-color:#e08a00}.cmd.controle{border-left-color:#7a4fd6}.cmd.attente{border-left-color:#8b93a5}.cmd.livree{border-left-color:#5b6578}
select.st{font-weight:600;border:0;color:#fff;padding:5px 8px;border-radius:99px;cursor:pointer}
select.st.attente{background:#8b93a5}select.st.complet{background:#1f9d55}select.st.fabrication{background:#e08a00}select.st.controle{background:#7a4fd6}select.st.livree{background:#5b6578}
.ind{font-size:12px;color:var(--mut);white-space:nowrap}.ind.ok{color:var(--ok)}.ind.partiel{color:var(--warn)}
.head{display:grid;grid-template-columns:34px 1fr 150px 90px 150px 150px;gap:10px;padding:9px 14px;align-items:center;cursor:pointer}
.rang{font-weight:700;color:var(--mut)}.client{font-weight:600}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--mut);text-align:center}

.retard{color:var(--ko);font-weight:600}.proche{color:var(--warn);font-weight:600}
.det{display:none;border-top:1px solid var(--line);padding:6px 14px 12px;overflow-x:auto}.cmd.open .det{display:block}
/* tableau mensuel */
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;z-index:1;border-bottom:2px solid var(--line)}
td.n,th.n{text-align:right}
tr.g1 td{border-top:2px solid var(--line)}
tr.opt td.c{color:var(--mut)}
tr.fait td{color:var(--mut)}
tr.fait td.d{text-decoration:line-through}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--mut)}
.pt.ok{background:var(--ok)}.pt.manque{background:var(--ko)}.pt.inconnu{background:var(--warn)}.pt.livree{background:#9aa}
tfoot td{font-weight:700;position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--line)}
.exc{display:inline-block;width:8px;height:20px;border-radius:3px;vertical-align:middle}
/* gantt */
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
.gt{position:relative;min-width:max-content}
.gr{display:flex;border-bottom:1px solid var(--line)}
.gn{position:sticky;left:0;z-index:3;width:200px;min-width:200px;background:var(--card);border-right:2px solid var(--line);padding:6px 10px;font-weight:600;display:flex;flex-direction:column;justify-content:center}
.gdays{display:flex;position:relative}
.gd{width:var(--w);min-width:var(--w);text-align:center;font-size:11px;border-right:1px solid var(--line);color:var(--mut)}
.gd.cfa{background:#ffd6e7}.gd.we{background:var(--we)}.gd.ferie{background:var(--fer)}.gd.cp{background:var(--cp)}.gd.absence{background:var(--abs)}
.gd.auj{box-shadow:inset 2px 0 0 var(--ko),inset -2px 0 0 var(--ko)}
.ghead .gd{padding:2px 0;line-height:1.2}.ghead .gm{font-weight:700;color:var(--txt);text-align:left;padding:3px 6px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.task{position:absolute;height:22px;border-radius:5px;font-size:11px;line-height:22px;padding:0 6px;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;background:var(--ok);border:1px solid rgba(0,0,0,.15)}
.task.fabrication{background:#e08a00}.task.controle{background:#7a4fd6}
.task.retard{outline:2px solid var(--ko);outline-offset:-1px}
.task.manuel::before{content:"📌 "}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid var(--line)}
.panel{position:fixed;right:16px;bottom:16px;width:430px;max-width:calc(100vw - 32px);max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:14px;z-index:20;display:none}
.panel h3{margin:0 0 6px;font-size:15px}.panel p{margin:4px 0}.panel .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px}
.chk{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
button.et{width:24px;height:24px;padding:0;border-radius:50%;font-size:11px;font-weight:700;color:var(--mut);margin-right:3px}
button.et.fait{background:#1f9d55;border-color:#1f9d55;color:#fff}
.rap{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:10px;padding:9px 14px;margin-bottom:6px}
.rap.rouge{border-left-color:var(--ko)}.rap .ic{font-size:16px}
.badgeN{background:var(--ko);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.impr header, body.impr main, body.impr .panel{display:none!important}
  body.impr #print{display:block}
  body.impr{background:#fff;color:#000}
  #print h2{margin:0 0 2px;font-size:16px}#print table{font-size:10px}#print th,#print td{padding:3px 5px}
  #print .gwrap{overflow:visible;border:0}
}
@media(max-width:700px){.head{grid-template-columns:30px 1fr 90px}.head>:nth-child(4),.head>:nth-child(5){display:none}}
</style>
</head>
<body>
<header>
  <h1>JPV Commandes 2026-2027</h1>
  <nav id="nav"></nav>
  <input id="q" placeholder="Rechercher client, VK, réf…" style="min-width:210px">
</header>
<main>
  <div id="note"></div>
  <div id="vue"></div>
  <div id="lu" class="sub" style="margin-top:14px"></div>
</main>
<div id="print"></div>
<div class="panel" id="panel"></div>
<script>
let RAPP = [], planningLu = null, CMD = [], MOIS = [], stockOk = false, erreurPlan = null, onglet = 'prio', filtre = 'complet', mois = null, G = null;
let gDebut = lundi(new Date()), gJours = 56;
const $ = id => document.getElementById(id);
const fmt = d => d ? d.split('-').reverse().join('/') : '';
const eur = n => (n || 0).toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' €';
const hh = n => n ? (Math.round(n * 100) / 100).toLocaleString('fr-FR') : '';
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dd = s => { const [y, m, j] = s.split('-').map(Number); return new Date(y, m - 1, j); };
function lundi(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const NOMS = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const STAT = {ok: 'STOCK OK', manque: 'STOCK PARTIEL', inconnu: 'pas dans JPV Stock', livree: 'expédiée'};
const STATUTS = [['attente', 'En attente'], ['complet', 'Complet'], ['fabrication', 'En fabrication'], ['controle', 'Au contrôle'], ['livree', 'Livrée']];
const LIB = Object.fromEntries(STATUTS);
const INDIC = {ok: '💡 stock complet', partiel: '💡 stock partiel', inconnu: '💡 stock inconnu'};
// menu de statut : c'est TOI qui décides, rien ne change tout seul
const selStatut = c => `<select class="st ${c.statut}" onclick="event.stopPropagation()" onchange="majStatut('${c.groupe}',this.value)">${STATUTS.map(([k, l]) => `<option value="${k}" ${c.statut === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const ETAPES = [['usinage', 'Usinage / Prépa fil', 'U'], ['acompte', 'Acompte', 'A'], ['controle', 'Contrôle / Emballage', 'C']];
const chips = c => ETAPES.map(([k, l, i]) => `<button class="et ${c.etapes[k] ? 'fait' : ''}" title="${l} : ${c.etapes[k] ? 'fait' : 'à faire'} (clique pour changer)" onclick="event.stopPropagation();majEtape('${c.groupe}','${k}',${!c.etapes[k]})">${i}</button>`).join('');
const etTxt = c => ETAPES.map(([k, l, i]) => i + (c.etapes[k] ? '✓' : '·')).join(' ');
async function majEtape(groupe, etape, fait) { await post('/api/etape', {groupe, etape, fait}); if (onglet === 'gantt') { await rechargerGantt(); charger(); } else charger(); }
async function relire() { $('lu').textContent = 'Relecture de l\'Excel…'; const r = await (await fetch('/api/relire', {method: 'POST', body: '{}'})).json(); if (!r.ok) alert('Impossible de relire l\'Excel : ' + r.erreur); charger(); }
async function majDebut(groupe, jour) { await post('/api/demarrage', {groupe, jour: jour || null}); rechargerGantt(); }
async function majStatut(groupe, v) { await post('/api/statut', {groupe, statut: v === 'attente' ? null : v}); charger(); }

async function charger() {
  const r = await (await fetch('/api/commandes')).json();
  CMD = r.commandes; MOIS = r.mois; stockOk = r.stock_charge; erreurPlan = r.erreur; planningLu = r.planning_lu;
  try { RAPP = (await (await fetch('/api/rappels')).json()).rappels; notifier(); } catch (e) { RAPP = []; }
  if (!mois) mois = (CMD.find(c => !c.livree) || {mois: MOIS[0]}).mois;
  if (onglet === 'gantt') await chargerGantt();
  afficher();
}
async function chargerGantt() {
  G = await (await fetch(`/api/gantt?debut=${iso(gDebut)}&jours=${gJours}`)).json();
}

function afficher() {
  $('nav').innerHTML = [['prio', 'Prioritaires'], ['plan', 'Planning'], ['gantt', 'Gantt salariés'], ['suivi', '📱 Suivi atelier'], ['sal', '👥 Salariés'], ['rapp', '🔔 Rappels']].map(([k, l]) =>
    `<button class="${onglet === k ? 'on' : ''}" onclick="choisir('${k}')">${l}${k === 'rapp' && RAPP.length ? '<span class="badgeN">' + RAPP.filter(x => x.niveau === 'rouge').length + '</span>' : ''}</button>`).join('');
  $('lu').innerHTML = (planningLu ? 'Planning Excel relu le ' + fmt(planningLu.slice(0, 10)) + ' à ' + planningLu.slice(11, 16) + ' · ' : '') + '<button onclick="relire()">↻ Relire l\'Excel maintenant</button>';
  $('note').innerHTML = (erreurPlan ? `<div class="note">⚠️ ${erreurPlan}</div>` : '') + (CMD.length === 0 && !erreurPlan ? '<div class="note">Aucune commande : le planning Excel n\'a pas encore été lu.</div>' : '') + (stockOk ? '' :
    '<div class="note">⚠️ JPV Stock est introuvable : aucune commande ne peut être déclarée complète. Vérifie que le dossier C:\\Users\\cmore\\JPV_STOCK existe.</div>');
  ({prio: vuePrio, plan: vuePlan, gantt: vueGantt, rapp: vueRapp, sal: vueSal, suivi: vueSuivi})[onglet]();
}
async function choisir(k) { onglet = k; if (k === 'gantt') await chargerGantt(); if (k === 'sal') await chargerSal(); if (k === 'suivi') await chargerSuivi(); afficher(); }

const recherche = c => { const q = $('q').value.toLowerCase(); return !q || JSON.stringify([c.client, c.cde, c.lignes.map(l => [l.vk, l.nomenc, l.designation])]).toLowerCase().includes(q); };

/* ---------------------------------------------------------------- Prioritaires */
function vuePrio() {
  const nb = k => CMD.filter(c => c.statut === k).length;
  const heures = k => CMD.filter(c => c.statut === k).reduce((s, c) => s + c.heures, 0);
  let h = `<div class="kpis">
    <div class="kpi"><b style="color:#1f9d55">${nb('complet')}</b><span>Complet · ${hh(heures('complet')) || 0} h</span></div>
    <div class="kpi"><b style="color:#e08a00">${nb('fabrication')}</b><span>En fabrication · ${hh(heures('fabrication')) || 0} h</span></div>
    <div class="kpi"><b style="color:#7a4fd6">${nb('controle')}</b><span>Au contrôle</span></div>
    <div class="kpi"><b style="color:#8b93a5">${nb('attente')}</b><span>En attente (sans statut)</span></div>
    <div class="kpi"><b>${nb('livree')}</b><span>Livrées</span></div></div>
    <div class="bar">${[['complet', 'Complet'], ['fabrication', 'En fabrication'], ['controle', 'Au contrôle'], ['attente', 'En attente'], ['toutes', 'Toutes (à livrer)'], ['livree', 'Livrées']].map(([k, l]) =>
      `<button class="${filtre === k ? 'on' : ''}" onclick="filtre='${k}';afficher()">${l}</button>`).join('')}
      <button onclick="imprimerListe()">📄 PDF liste de fabrication</button> <span class="sub">Tu choisis le statut de chaque commande avec le menu à droite. JPV Stock donne seulement une indication 💡.</span></div>`;
  const liste = CMD.filter(c => (filtre === 'toutes' ? !c.livree : c.statut === filtre) && recherche(c));
  // Livrées : les plus récentes en haut (date de livraison, sinon mois de l'onglet)
  if (filtre === 'livree') liste.sort((a, b) => (b.delai || '').localeCompare(a.delai || '') || MOIS.indexOf(b.mois) - MOIS.indexOf(a.mois) || b.groupe.localeCompare(a.groupe, undefined, {numeric: true}));
  h += liste.map((c, i) => {
    const j = c.livree ? null : c.jours, cls = j == null ? '' : j < 0 ? 'retard' : j <= 7 ? 'proche' : '';
    const delai = c.livree ? 'livrée' : j == null ? 'sans délai' : j < 0 ? `en retard de ${-j} j` : j === 0 ? "aujourd'hui" : `dans ${j} j`;
    return `<div class="cmd ${c.statut}"><div class="head" onclick="this.parentNode.classList.toggle('open')">
      <div class="rang">${i + 1}</div>
      <div><div class="client">${c.client || '—'} <span class="sub">VK ${c.vk || ''}</span></div><div class="sub">${c.designation || ''} · ${c.lignes.length} ligne(s) · ${c.mois} · ${eur(c.ca)}</div></div>
      <div class="${cls}">${fmt(c.delai) || '—'}<div class="sub ${cls}">${delai}</div></div>
      <div>${c.heures ? hh(c.heures) + ' h' : '<span class="sub">— h</span>'}</div>
      <div><div class="ind ${c.stock}">${INDIC[c.stock]}</div><div style="margin-top:3px">${chips(c)}</div></div>
      ${selStatut(c)}</div>
      <div class="det"><table><tr><th>VK</th><th>Nomenclature</th><th>Désignation</th><th class="n">Qté</th><th>JPV Stock</th></tr>
      ${c.lignes.map(l => `<tr><td>${l.vk}</td><td>${l.nomenc}</td><td>${l.designation || ''}</td><td class="n">${l.qte}</td><td><span class="pt ${l.statut}"></span>${STAT[l.statut]}</td></tr>`).join('')}
      </table></div></div>`;
  }).join('') || '<p class="sub">Aucune commande dans cette vue.</p>';
  $('vue').innerHTML = h;
}

/* ---------------------------------------------------------------- Planning (comme l'Excel) */
function vuePlan() {
  const du = CMD.filter(c => c.mois === mois && recherche(c));
  const lignes = du.flatMap(c => c.lignes.map((l, i) => ({l, c, i})));
  const totH = lignes.reduce((s, x) => s + (x.l.h_tot || 0), 0), totCA = lignes.reduce((s, x) => s + (x.l.ca_total || 0), 0);
  const ouv = du.filter(c => !c.livree);
  let h = `<div class="bar">${MOIS.map(m => `<button class="${m === mois ? 'on' : ''}" onclick="mois='${m}';afficher()">${m}</button>`).join('')}</div>
   <div class="kpis"><div class="kpi"><b>${du.length}</b><span>commandes</span></div><div class="kpi"><b>${ouv.length}</b><span>à livrer</span></div>
   <div class="kpi"><b>${hh(totH)} h</b><span>heures du mois</span></div><div class="kpi"><b>${eur(totCA)}</b><span>CA du mois</span></div></div>
   <div class="wrap"><table><thead><tr><th></th><th>Type</th><th>Récep. cde</th><th>AR</th><th>Client</th><th>VK</th><th>CDE</th><th>Nomenc.</th><th class="n">Qté</th>
   <th>Délai</th><th>Rec. prod</th><th>Désignation</th><th>Étape prod.</th><th class="n">H. unit.</th><th class="n">H. tot.</th><th class="n">C.A.</th><th class="n">C.A. total</th><th>JPV Stock</th><th>Étapes</th><th>Statut</th></tr></thead><tbody>`;
  h += lignes.map(({l, c, i}) => {
    const retard = !c.livree && l.delai && l.delai < iso(new Date());
    return `<tr class="${i === 0 ? 'g1' : 'opt'} ${c.livree ? 'fait' : ''}">
      <td><span class="exc" style="background:${l.couleur ? '#' + l.couleur : 'transparent'}" title="Couleur dans l'Excel"></span></td>
      <td>${i === 0 ? l.type || '' : ''}</td><td>${fmt(l.date_recep)}</td><td>${fmt(l.date_ar)}</td>
      <td class="c">${i === 0 ? '<b>' + (l.client || '') + '</b>' : ''}</td><td>${l.vk}</td><td>${i === 0 ? l.cde || '' : ''}</td><td>${l.nomenc}</td>
      <td class="n">${l.qte}</td><td class="${retard ? 'retard' : ''}">${fmt(l.delai)}</td><td>${fmt(l.rec_prod) || l.rec_prod || ''}</td>
      <td class="d">${l.designation || ''}</td><td>${l.etape || ''}</td><td class="n">${hh(l.h_unit)}</td><td class="n">${hh(l.h_tot)}</td>
      <td class="n">${l.ca_unit ? l.ca_unit.toLocaleString('fr-FR') : ''}</td><td class="n">${l.ca_total ? l.ca_total.toLocaleString('fr-FR', {maximumFractionDigits: 0}) : ''}</td>
      <td><span class="pt ${l.statut}"></span>${l.statut === 'livree' ? '✓' : STAT[l.statut]}</td><td>${i === 0 ? chips(c) : ''}</td><td>${i === 0 ? selStatut(c) : ''}</td></tr>`;
  }).join('');
  h += `</tbody><tfoot><tr><td colspan="14">Total ${mois}</td><td class="n">${hh(totH)}</td><td></td><td class="n">${eur(totCA)}</td><td></td><td></td><td></td></tr></tfoot></table></div>`;
  $('vue').innerHTML = h;
}

/* ---------------------------------------------------------------- Gantt */
function vueGantt() {
  if (!G) { $('vue').innerHTML = '<p class="sub">Chargement…</p>'; return; }
  const W = gJours <= 28 ? 40 : gJours <= 56 ? 26 : 16, n = G.jours.length, deb = iso(gDebut), fin = G.jours[n - 1].date;
  const emps = G.salaries.filter(s => s.actif).map(s => s.nom);
  let h = `<div class="bar"><button onclick="imprimerGantt()">📄 PDF Gantt</button><button onclick="decaler(-14)">◀</button><button onclick="gDebut=lundi(new Date());rechargerGantt()">Aujourd'hui</button><button onclick="decaler(14)">▶</button>
    <select onchange="gJours=+this.value;rechargerGantt()">${[[28, '4 semaines'], [56, '8 semaines'], [91, '13 semaines'], [182, '6 mois']].map(([v, l]) => `<option value="${v}" ${gJours == v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <span class="sub">Les commandes au statut <b>Complet, En fabrication ou Au contrôle</b> peuvent être affectées : <b>c'est toi qui choisis</b> (tableau en dessous). Capacité selon les heures de chaque salarié : 39 h = 8,5 h du lundi au jeudi + 5 h le vendredi.</span></div>
    <div class="chk" style="margin-bottom:10px"><b>Salariés inclus :</b>${G.salaries.map(s => `<label><input type="checkbox" ${s.actif ? 'checked' : ''} onchange="inclure('${s.nom.replace(/'/g, "\\'")}',this.checked)">${NOMS(s.nom)}</label>`).join('')}</div>`;

async function rechargerGantt() { await chargerGantt(); try { RAPP = (await (await fetch('/api/rappels')).json()).rappels; } catch (e) {} afficher(); }

  t.affectees.forEach(a => { let p = parPhase.find(x => x.e === a.etape); if (!p) { p = {e: a.etape, lib: a.etape_lib, l: []}; parPhase.push(p); } p.l.push(NOMS(a.nom) + ' (' + hh(a.heures) + ' h)'); });
  return '📌 ' + parPhase.map(p => (p.e === 'toute' ? '' : '<b>' + p.lib + '</b> : ') + p.l.join(', ')).join(' → ');
}

function rendreLignes() {
  const emps = G.salaries.filter(s => s.actif);

window.onafterprint = () => document.body.classList.remove('impr');
function imprimer(titre, html) {
  $('print').innerHTML = `<h2>${titre}</h2><div class="sub" style="margin-bottom:6px">Édité le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}</div>` + html;
  document.body.classList.add('impr'); setTimeout(() => window.print(), 100);
}
function tableListe() {
  const lignes = G.pretes.map((t, i) => `<tr><td>${i + 1}</td><td><b>${t.client || ''}</b></td><td>${t.vk || ''}</td><td>${t.designation || ''}</td><td class="n">${hh(t.heures_total)}</td><td>${fmt(t.delai)}</td><td>${fmt(t.debut) || '—'}</td>
      <td>${affTxt(t).replace(/📌 /, '').replace(/ → /g, '<br>→ ')}</td><td>${fmt(t.fin_commande)}${t.retard ? ' ⚠' : ''}</td>
      <td>${LIB[t.statut]}</td><td>${ETAPES.map(([k, l]) => (t.etapes[k] ? '☑ ' : '☐ ') + l).join('<br>')}</td></tr>`).join('');
  return `<table><thead><tr><th>#</th><th>Client</th><th>N° VK</th><th>Désignation</th><th class="n">Heures</th><th>Délai</th><th>Début</th><th>Salarié(s)</th><th>Fin prévue</th><th>Statut</th><th>Étapes</th></tr></thead><tbody>${lignes}</tbody></table>`;
}
async function imprimerListe() {
  await chargerGantt();
  imprimer('Liste de fabrication — commandes Complet / En fabrication / Au contrôle', tableListe());
}
async function imprimerGantt() {
  await chargerGantt(); afficher();
  const g = document.querySelector('.gwrap'); if (!g) return;
  imprimer(`Gantt salariés — du ${fmt(iso(gDebut))} au ${fmt(G.jours[G.jours.length - 1].date)}`, `<div style="zoom:0.6">${g.outerHTML}</div><div style="margin-top:8px">${tableListe()}</div>`);
}

const post = (u, d) => fetch(u, {method: 'POST', body: JSON.stringify(d)});
$('q').oninput = afficher;
charger(); setInterval(() => { if (onglet !== 'gantt') charger(); }, 60000);
</script>
