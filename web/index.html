<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPV Commandes</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--txt:#1d2433;--mut:#6b7385;--ok:#1f9d55;--ko:#d9534f;--warn:#e0a100;--line:#e3e6ec;--acc:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e2330;--txt:#e8ebf2;--mut:#98a1b6;--line:#2d3446}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}
header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}main{padding:0 16px 32px;max-width:1100px;margin:auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.kpi b{font-size:22px;display:block}.kpi span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,select,input{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt)}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cmd{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:10px;margin-bottom:8px}
.cmd.complete{border-left-color:var(--ok)}.cmd.incomplete{border-left-color:var(--ko)}
.head{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;padding:10px 14px;align-items:center;cursor:pointer}
.rang{font-weight:700;color:var(--mut);min-width:28px}.client{font-weight:600}.sub{color:var(--mut);font-size:13px}
.badge{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;background:var(--mut)}
.complete .badge{background:var(--ok)}.incomplete .badge{background:var(--ko)}
.retard{color:var(--ko);font-weight:600}.proche{color:var(--warn);font-weight:600}
.det{display:none;border-top:1px solid var(--line);padding:6px 14px 12px;overflow-x:auto}.cmd.open .det{display:block}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}.s-ok{color:var(--ok)}.s-manque{color:var(--ko)}.s-inconnu{color:var(--warn)}
.note{background:var(--card);border:1px dashed var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
@media(max-width:600px){.head{grid-template-columns:auto 1fr}}
</style>
</head>
<body>
<header>
  <h1>JPV Commandes 2026-2027</h1>
  <div class="bar" style="margin:0">
    <input id="q" placeholder="Rechercher client, VK, réf…" style="min-width:220px">
    
  </div>
</header>
<main>
  <div id="note"></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar" id="filtres"></div>
  <div id="liste"></div>
</main>
<script>
let DATA = [], filtre = 'complete', stockOk = false;
const fmt = d => d ? d.split('-').reverse().join('/') : '—';
const eur = n => (n || 0).toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' €';

async function charger() {
  const r = await (await fetch('/api/commandes')).json();
  DATA = r.commandes; stockOk = r.stock_charge; afficher();
}

function afficher() {
  const ouvertes = DATA.filter(c => c.statut !== 'livree');
  const compl = ouvertes.filter(c => c.statut === 'complete');
  document.getElementById('note').innerHTML = stockOk ? '' :
    '<div class="note">⚠️ JPV Stock est introuvable : aucune commande ne peut être déclarée complète. Vérifie que le dossier C:\\Users\\cmore\\JPV_STOCK existe.</div>';
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><b>${ouvertes.length}</b><span>commandes à livrer</span></div>
     <div class="kpi"><b style="color:var(--ok)">${compl.length}</b><span>complètes (prêtes)</span></div>
     <div class="kpi"><b style="color:var(--ko)">${ouvertes.length - compl.length}</b><span>incomplètes</span></div>
     <div class="kpi"><b>${eur(compl.reduce((s, c) => s + c.ca, 0))}</b><span>CA prêt à produire</span></div>`;
  const onglets = [['complete', 'Prioritaires (complètes)'], ['incomplete', 'Incomplètes'], ['toutes', 'Toutes'], ['livree', 'Livrées']];
  document.getElementById('filtres').innerHTML = onglets.map(([k, l]) =>
    `<button class="${filtre === k ? 'on' : ''}" onclick="filtre='${k}';afficher()">${l}</button>`).join('');
  const q = document.getElementById('q').value.toLowerCase();
  let liste = DATA.filter(c => filtre === 'toutes' ? c.statut !== 'livree' : c.statut === filtre);
  if (q) liste = liste.filter(c => JSON.stringify([c.client, c.cde, c.lignes.map(l => [l.vk, l.nomenc, l.designation])]).toLowerCase().includes(q));
  document.getElementById('liste').innerHTML = liste.map((c, i) => {
    const j = c.jours, cls = j == null ? '' : j < 0 ? 'retard' : j <= 7 ? 'proche' : '';
    const delai = j == null ? 'sans délai' : j < 0 ? `en retard de ${-j} j` : j === 0 ? 'aujourd\'hui' : `dans ${j} j`;
    const badge = c.statut === 'complete' ? 'COMPLÈTE' : c.statut === 'livree' ? 'LIVRÉE' : `${c.nb_manque} ligne(s) à compléter`;
    return `<div class="cmd ${c.statut}" id="${c.groupe}">
      <div class="head" onclick="this.parentNode.classList.toggle('open')">
        <div class="rang">${i + 1}</div>
        <div><div class="client">${c.client || '—'} <span class="sub">${c.cde || ''}</span></div>
             <div class="sub">${c.lignes.length} ligne(s) · ${c.mois} · ${eur(c.ca)}</div></div>
        <div class="${cls}">${fmt(c.delai)}<div class="sub ${cls}">${delai}</div></div>
        <span class="badge">${badge}</span></div>
      <div class="det"><table><tr><th>VK</th><th>Nomenclature</th><th>Désignation</th><th>Qté</th><th>JPV Stock</th><th>État</th></tr>
      ${c.lignes.map(l => `<tr><td>${l.vk}</td><td>${l.nomenc}</td><td>${l.designation || ''}</td><td>${l.qte}</td>
        <td>${{ok:'STOCK OK',manque:'STOCK PARTIEL',inconnu:'—',livree:'EXPÉDIÉE'}[l.statut]}</td><td class="s-${l.statut}">${{ok: '✔ en stock', manque: '✖ insuffisant', inconnu: '? pas encore dans JPV Stock', livree: 'livrée'}[l.statut]}</td></tr>`).join('')}
      </table><p><button onclick="livrer('${c.groupe}',${c.statut !== 'livree'})">${c.statut === 'livree' ? 'Remettre en cours' : 'Marquer comme livrée'}</button></p></div></div>`;
  }).join('') || '<p class="sub">Aucune commande dans cette vue.</p>';
}

async function livrer(groupe, livree) {
  await fetch('/api/livree', {method: 'POST', body: JSON.stringify({groupe, livree})}); charger();
}
document.getElementById('q').oninput = afficher;
charger(); setInterval(charger, 60000);
</script>
</body>
</html>
