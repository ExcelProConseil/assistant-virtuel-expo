<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonjour en couleurs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono&display=swap">
<style>
  /* Thème clair : la couleur du texte (encre) et les couleurs de fond proposées */
  :root {
    --encre: #1c1b22;
    --neutre: #f3f4f7;
    --menthe: #cdeedb;
    --ciel: #cfe4f8;
    --lavande: #ddd7f8;
    --rose: #f9d2e0;
    --peche: #ffd9c4;
    --citron: #f4eba3;
  }

  /* Thème sombre : les mêmes couleurs, en version foncée */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --encre: #f2f1f6;
      --neutre: #17171c;
      --menthe: #123526;
      --ciel: #122c44;
      --lavande: #262147;
      --rose: #45192b;
      --peche: #472719;
      --citron: #37320f;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --encre: #f2f1f6;
    --neutre: #17171c;
    --menthe: #123526;
    --ciel: #122c44;
    --lavande: #262147;
    --rose: #45192b;
    --peche: #472719;
    --citron: #37320f;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    height: 100%;
  }

  body {
    --fond: var(--neutre); /* remplacée par le script à chaque clic */
    min-height: 100%;
    margin: 0;
    display: grid;
    align-content: center;
    padding-inline: clamp(16px, 6vw, 80px);
    padding-block: 48px;
    background: var(--fond);
    color: var(--encre);
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    transition: background-color 0.45s ease;
  }

  main {
    width: 100%;
    max-width: 60rem;
    margin-inline: auto;
    display: grid;
    gap: clamp(24px, 4vw, 40px);
  }

  h1 {
    margin: 0;
    font-size: clamp(3.5rem, 20vw, 10rem);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .commandes {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 28px;
  }

  button {
    padding: 14px 26px;
    border: 0;
    border-radius: 999px;
    background: var(--encre);
    color: var(--fond);
    font: inherit;
    font-size: 1.125rem;
    font-weight: 650;
    cursor: pointer;
    transition: color 0.45s ease, transform 0.15s ease;
  }

  @media (hover: hover) {
    button:hover {
      transform: translateY(-2px);
    }
  }

  button:active {
    transform: scale(0.97);
  }

  button:focus-visible {
    outline: 3px solid var(--encre);
    outline-offset: 4px;
  }

  .teinte {
    margin: 0;
    display: grid;
    gap: 4px;
  }

  .teinte-titre {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .teinte-valeur {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 1.125rem;
    font-weight: 600;
  }

  code {
    font-family: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.9em;
    font-weight: 400;
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: reduce) {
    body,
    button {
      transition: none;
    }

    button:hover,
    button:active {
      transform: none;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Bonjour</h1>
  <div class="commandes">
    <button type="button" id="changer">Changer la couleur</button>
    <p class="teinte">
      <span class="teinte-titre">Couleur de fond</span>
      <span class="teinte-valeur">
        <span id="nom-couleur" aria-live="polite">Neutre</span>
        <code id="code-couleur">#F3F4F7</code>
      </span>
    </p>
  </div>
</main>
<script>
  // Les couleurs proposées, dans l'ordre. Leurs valeurs claires et sombres sont dans le CSS.
  const couleurs = [
    { id: "neutre", nom: "Neutre" },
    { id: "menthe", nom: "Menthe" },
    { id: "ciel", nom: "Ciel" },
    { id: "lavande", nom: "Lavande" },
    { id: "rose", nom: "Rose" },
    { id: "peche", nom: "Pêche" },
    { id: "citron", nom: "Citron" },
  ];
  let position = 0;

  const bouton = document.getElementById("changer");
  const nomCouleur = document.getElementById("nom-couleur");
  const codeCouleur = document.getElementById("code-couleur");

  function afficherCouleur() {
    const { id, nom } = couleurs[position];
    document.body.style.setProperty("--fond", `var(--${id})`);
    nomCouleur.textContent = nom;
    codeCouleur.textContent = getComputedStyle(document.documentElement)
      .getPropertyValue(`--${id}`)
      .trim()
      .toUpperCase();
  }

  bouton.addEventListener("click", () => {
    position = (position + 1) % couleurs.length;
    afficherCouleur();
  });

  // Met à jour le code affiché quand le thème passe de clair à sombre, ou l'inverse.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", afficherCouleur);
  new MutationObserver(afficherCouleur).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"],
  });

  afficherCouleur();
</script>
</body>
</html>
